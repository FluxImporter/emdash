packages:
  - packages/*
  - sites/*
onlyBuiltDependencies:
  - esbuild
  - sharp
# No package version younger than 14 days (in minutes) is resolved, transitive ones included
# (M6d spec, Ruling 54): the Anthropic SDK's caret dependencies otherwise pull days-old releases.
minimumReleaseAge: 20160
# EmDash and the Kumo version its admin pins are exempt, as in EmDash's own site template: a
# plugin release has to follow the admin's exact Kumo version, and EmDash ships every few days.
minimumReleaseAgeExclude:
  - emdash
  - "@emdash-cms/*"
  - "@cloudflare/kumo"
